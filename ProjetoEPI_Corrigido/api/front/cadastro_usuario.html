<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta | Sistema de Detecção de EPI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/cadastrar_usuario.css">
</head>
<body>

    <div class="bg-animation"></div>

    <div class="register-card">
        <h2>Cadastro de Operador</h2>
        
        <div id="error-msg" style="display:none; color:#ff4444; text-align:center; margin-bottom:10px;"></div>
        <div id="success-msg" style="display:none; color:#00C851; text-align:center; margin-bottom:10px;"></div>

        <form id="registerForm">
            <div class="row">
                <div class="col-md-12 mb-3">
                    <label class="form-label">Nome Completo</label>
                    <input type="text" class="form-control" id="name" placeholder="Ex: João Silva" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">E-mail</label>
                <input type="email" class="form-control" id="email" placeholder="email@empresa.com" required>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Matrícula (Login)</label>
                    <input type="text" class="form-control" id="regId" placeholder="000000" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Cargo</label>
                    <select class="form-select" id="role" required>
                        <option value="" selected disabled>Selecione...</option>
                        <option value="operador">Operador</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Senha de Acesso</label>
                <input type="password" class="form-control" id="newPassword" placeholder="••••••••" required>
            </div>
            <div class="password-strength">
                <div id="strengthBar" class="strength-bar"></div>
            </div>

            <button type="submit" class="btn-register">Finalizar Cadastro</button>
        </form>

        <a href="index.html" class="back-link">← Voltar para o Login</a>
    </div>

    <script src="js/cadastrar_usuario.js?v=2"></script>
</body>
</html>
