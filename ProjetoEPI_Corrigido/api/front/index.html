<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Sistema de Detecção de EPI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/index_style1.css">
</head>
<body>

    <div class="bg-animation"></div>

    <div class="login-card">
        <h2>EPI Check <br> <small style="font-size: 0.5em;">Portaria Segura</small></h2>
        
        <div id="error-msg" style="display: none;">Credenciais inválidas. Tente novamente.</div>

        <form id="loginForm">
            <div class="mb-3">
                <label for="username" class="form-label text-warning">Usuário/Matrícula</label>
                <input type="email" class="form-control" id="username" placeholder="Digite seu acesso (e-mail)" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label text-warning">Senha</label>
                <input type="password" class="form-control" id="password" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn-login mt-3">Acessar Sistema</button>
        </form>

        <div class="auth-secondary-links">
            <span>Ainda não tem acesso?</span><br>
            <a href="cadastro_usuario.html" class="fw-bold">Criar nova conta</a>
            <span class="separator">|</span>
            <a href="esqueci_senha.html">Esqueci a senha</a>
        </div>

        <div class="footer-text">
            © 2026 SENAI - Sistema de Monitoramento de Segurança
        </div>
    </div>

    <script src="js/index.js?v=2"></script>

</body>
</html>
