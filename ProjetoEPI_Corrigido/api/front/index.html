<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | EPI Check - Portaria Segura</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/index_style1.css">
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <div class="login-icon-box">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
            </div>
            <h2 class="login-title">EPI <span>CHECK</span></h2>
            <p class="login-subtitle">Sistema de Detecção e Portaria Segura</p>
        </div>
        
        <div id="error-msg" style="display: none;">Credenciais inválidas. Tente novamente.</div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username" class="form-label">Usuário / Matrícula / E-mail</label>
                <input type="text" class="form-control-epi" id="username" placeholder="ex: operador@empresa.com ou admin" required>
            </div>
            
            <div class="form-group">
                <label for="password" class="form-label">Senha de Acesso</label>
                <input type="password" class="form-control-epi" id="password" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn-login">Acessar Sistema</button>
        </form>

        <div class="auth-secondary-links">
            <span>Ainda não tem cadastro?</span><br>
            <a href="senha_admin.html" class="fw-bold">Criar nova conta</a>
            <span class="separator">•</span>
            <a href="esqueci_senha.html">Esqueci a senha</a>
        </div>

        <div class="footer-text">
            © 2026 SENAI • Sistema de Monitoramento de Segurança NR-6
        </div>
    </div>

    <script src="js/index.js"></script>

</body>
</html>
