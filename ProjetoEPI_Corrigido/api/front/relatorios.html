<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatórios de Verificação | EPI Check</title>
    <link rel="stylesheet" href="css/theme.css">
</head>
<body>

    <!-- Header Padrão Unificado -->
    <header class="app-header">
        <a href="pagina_principal.html" class="app-brand">
            <div class="app-brand-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
            </div>
            <div>
                <h1 class="app-brand-title">EPI <span>CHECK</span></h1>
                <span class="app-brand-subtitle">Relatórios de Auditoria</span>
            </div>
        </a>

        <div class="app-user-nav">
            <a href="pagina_admin.html" class="btn-secondary-epi" style="padding: 0.45rem 0.9rem; font-size: 0.8rem;">← Painel Admin</a>
            <a href="pagina_principal.html" class="btn-secondary-epi" style="padding: 0.45rem 0.9rem; font-size: 0.8rem;">Central</a>
        </div>
    </header>

    <main class="app-container">
        <a href="pagina_principal.html" class="btn-back-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8z"/>
            </svg>
            Voltar ao Dashboard
        </a>

        <div class="app-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
                <div>
                    <h2 style="font-family: var(--font-tech); font-size: 1.4rem; color: var(--text-primary); margin-bottom: 0.25rem;">
                        Histórico de Verificações Realizadas
                    </h2>
                    <p style="font-size: 0.85rem; color: var(--text-muted);">
                        Auditorias registradas pela Inteligência Artificial na portaria.
                    </p>
                </div>
                <a href="verificacao.html" class="btn-primary-epi" style="padding: 0.6rem 1.2rem; font-size: 0.85rem;">
                    + Nova Verificação IA
                </a>
            </div>

            <div class="table-responsive">
                <table class="app-table">
                    <thead>
                        <tr>
                            <th width="25%">Funcionário</th>
                            <th width="20%">E-mail / Matrícula</th>
                            <th width="25%">Detecção IA</th>
                            <th width="15%">Estado (IA)</th>
                            <th width="15%">Data / Hora</th>
                        </tr>
                    </thead>
                    <tbody id="relatoriosTable">
                        <tr><td colspan="5" style="text-align:center;padding:30px;color:var(--text-muted);">Carregando histórico...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="js/pagina_admin.js"></script>
</body>
</html>
