<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar EPI | EPI Check</title>
    <link rel="stylesheet" href="css/theme.css">
    <style>
        .form-card-container {
            max-width: 620px;
            margin: 0 auto;
        }

        .epi-select-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 0.75rem;
            margin-bottom: 1.25rem;
        }

        .epi-radio-card {
            border: 1px solid var(--border-card);
            border-radius: var(--radius-md);
            padding: 1rem;
            text-align: center;
            background: rgba(12, 18, 32, 0.7);
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .epi-radio-card:hover {
            border-color: var(--primary-amber);
            background: rgba(245, 158, 11, 0.05);
        }

        .epi-radio-card.selected {
            border-color: var(--primary-amber);
            background: rgba(245, 158, 11, 0.12);
            box-shadow: 0 0 15px var(--primary-amber-glow);
        }

        .epi-radio-card input {
            display: none;
        }

        .epi-card-emoji {
            font-size: 1.8rem;
            margin-bottom: 0.4rem;
        }

        .epi-card-text {
            font-size: 0.825rem;
            font-weight: 600;
            color: var(--text-primary);
        }
    </style>
</head>
<body>

    <!-- Header Padrão Unificado -->
    <header class="app-header">
        <a href="pagina_principal.html" class="app-brand">
            <div class="app-brand-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
            </div>
            <div>
                <h1 class="app-brand-title">EPI <span>CHECK</span></h1>
                <span class="app-brand-subtitle">Almoxarifado & Reposição</span>
            </div>
        </a>

        <div class="app-user-nav">
            <a href="pagina_principal.html" class="btn-secondary-epi" style="padding: 0.45rem 0.9rem; font-size: 0.8rem;">← Voltar</a>
        </div>
    </header>

    <main class="app-container">
        <div class="form-card-container">
            <a href="pagina_principal.html" class="btn-back-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8z"/>
                </svg>
                Voltar ao Início
            </a>

            <div class="app-card">
                <div style="margin-bottom: 1.5rem;">
                    <h2 style="font-family: var(--font-tech); font-size: 1.4rem; color: var(--text-primary); margin-bottom: 0.25rem;">
                        Solicitar Equipamento de Proteção
                    </h2>
                    <p style="font-size: 0.85rem; color: var(--text-muted);">
                        Informe qual EPI necessita de reposição ou troca e o motivo.
                    </p>
                </div>

                <form id="formSolicitar">
                    <div class="form-group">
                        <label class="form-label">Selecione o Equipamento:</label>
                        <div class="epi-select-grid">
                            <label class="epi-radio-card selected" onclick="selectEpiCard(this, '1', 'Capacete de Segurança')">
                                <input type="radio" name="epi_card" value="1" checked>
                                <div class="epi-card-emoji">🪖</div>
                                <div class="epi-card-text">Capacete</div>
                            </label>

                            <label class="epi-radio-card" onclick="selectEpiCard(this, '2', 'Óculos de Proteção')">
                                <input type="radio" name="epi_card" value="2">
                                <div class="epi-card-emoji">👓</div>
                                <div class="epi-card-text">Óculos</div>
                            </label>

                            <label class="epi-radio-card" onclick="selectEpiCard(this, '3', 'Colete Refletivo')">
                                <input type="radio" name="epi_card" value="3">
                                <div class="epi-card-emoji">🦺</div>
                                <div class="epi-card-text">Colete</div>
                            </label>

                            <label class="epi-radio-card" onclick="selectEpiCard(this, '4', 'Luvas de Proteção')">
                                <input type="radio" name="epi_card" value="4">
                                <div class="epi-card-emoji">🧤</div>
                                <div class="epi-card-text">Luvas</div>
                            </label>
                        </div>
                        <input type="hidden" id="epi_nome" name="epi_nome" value="1">
                        <input type="hidden" id="epi_texto" name="epi_texto" value="Capacete de Segurança">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="motivo">Motivo da Solicitação ou Troca:</label>
                        <textarea id="motivo" name="motivo" class="form-control-epi" rows="4" placeholder="Ex: Equipamento danificado em operação, desgaste natural, tamanho inadequado..." required></textarea>
                    </div>

                    <button type="submit" id="btnEnviarPedido" class="btn-primary-epi" style="width: 100%; padding: 1rem;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                        ENVIAR SOLICITAÇÃO
                    </button>
                </form>
            </div>
        </div>
    </main>

    <script src="js/auth.js"></script>
    <script>
        function selectEpiCard(cardEl, value, label) {
            document.querySelectorAll('.epi-radio-card').forEach(c => c.classList.remove('selected'));
            cardEl.classList.add('selected');
            document.getElementById('epi_nome').value = value;
            document.getElementById('epi_texto').value = label;
        }

        document.getElementById('formSolicitar').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('btnEnviarPedido');
            const epiId = document.getElementById('epi_nome').value;
            const epiNome = document.getElementById('epi_texto').value;
            const motivo = document.getElementById('motivo').value.trim();
            const usuarioLogado = JSON.parse(localStorage.getItem('usuarioLogado') || '{}');

            if (!motivo) {
                alert('Por favor, informe o motivo da troca.');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'REGISTRANDO...';

            const payload = {
                id_usuario: usuarioLogado.id_usuario || 1,
                nome_usuario: usuarioLogado.nome || 'Operador da Estação',
                id_epi: epiId,
                nome_epi: epiNome,
                descricao: motivo,
                data_solicitacao: new Date().toISOString(),
                status_solicitacao: 'Pendente'
            };

            // Salva no histórico local garantido
            try {
                const pendentes = JSON.parse(localStorage.getItem('solicitacoesLocais') || '[]');
                pendentes.unshift({
                    id_solicitacao: Date.now(),
                    ...payload
                });
                localStorage.setItem('solicitacoesLocais', JSON.stringify(pendentes));
            } catch(e) {}

            // Tenta enviar para a API se disponível
            try {
                const API_URL = 'public/index.php?route=solicitar';
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch(err) {
                // Silencioso se estiver sem servidor PHP ativo
            }

            alert('✅ Solicitação registrada com sucesso no sistema!');
            window.location.href = 'pagina_principal.html';
        });
    </script>
</body>
</html>
