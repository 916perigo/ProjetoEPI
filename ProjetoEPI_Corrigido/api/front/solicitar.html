<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Solicitar EPI | EPI Check</title>
</head>
<body class="bg-[#1A1A1A] text-white p-6 font-sans">
    <div class="max-w-lg mx-auto">
        <a href="pagina_principal.html" class="text-yellow-500 text-sm mb-6 inline-block">← Voltar</a>
        <h2 class="text-2xl font-bold mb-2">Solicitar EPI</h2>
        <p class="text-gray-400 text-sm mb-6">Informe qual equipamento precisa ser trocado.</p>

        <form id="formSolicitar" class="space-y-4">
            <select name="epi_nome" id="epi_nome" class="w-full bg-[#262626] border border-gray-700 rounded-xl p-4 outline-none text-white">
                <option value="">Selecione o equipamento...</option>
                <option value="1">Capacete de Segurança</option>
                <option value="2">Óculos de Proteção</option>
                <option value="3">Máscara Respiratória</option>
            </select>
            <textarea name="motivo" id="motivo" placeholder="Motivo da troca..." class="w-full bg-[#262626] border border-gray-700 rounded-xl p-4 h-32 outline-none text-white placeholder-gray-500 resize-none"></textarea>
            <button type="submit" class="w-full bg-yellow-500 text-black font-bold py-4 rounded-xl hover:bg-yellow-400 transition">ENVIAR PEDIDO</button>
        </form>
    </div>

    <script src="js/auth.js"></script>
    <script>
        document.getElementById('formSolicitar').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const epiSelect = document.getElementById('epi_nome');
            const motivo = document.getElementById('motivo').value;
            const usuarioLogado = JSON.parse(localStorage.getItem('usuarioLogado') || '{}');
            
            if (!usuarioLogado.id_usuario) {
                alert('Sessão expirada. Faça login novamente.');
                window.location.href = 'index.html';
                return;
            }
            
            if (!epiSelect.value || !motivo.trim()) {
                alert('Preencha todos os campos!');
                return;
            }
            
            const data = {
                id_usuario: usuarioLogado.id_usuario,
                id_epi: epiSelect.value,
                descricao: motivo
            };
            
            try {
                const isFileUrl = window.location.protocol === 'file:';
                const API_URL = isFileUrl 
                    ? 'http://localhost/ProjetoEPI_Corrigido/ProjetoEPI_Corrigido/api/front_livros/public/index.php?route=solicitar' 
                    : 'public/index.php?route=solicitar';

                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    alert('Pedido enviado com sucesso!');
                    window.location.href = 'pagina_principal.html';
                } else {
                    alert('Erro: ' + (result.error || 'Erro desconhecido.') + '\nDetalhes: ' + (result.details || ''));
                    console.error('Detalhes do erro do servidor:', result);
                }
            } catch (error) {
                console.error(error);
                alert('Erro de conexão ao enviar o pedido.');
            }
        });
    </script>
</body>
</html>
