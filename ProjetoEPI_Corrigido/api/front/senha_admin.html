<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificação Admin | EPI Check</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/index_style1.css">
</head>
<body>

  <div class="login-card">
    <div class="login-header">
      <div class="login-icon-box" style="background: linear-gradient(135deg, #ef4444, #f59e0b);">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <h2 class="login-title">Acesso <span>Restrito</span></h2>
      <p class="login-subtitle">Senha de Segurança Administrativa</p>
    </div>

    <form id="adminKeyForm">
      <div class="form-group">
        <label for="password" class="form-label">Chave de Autorização Admin</label>
        <input type="password" class="form-control-epi" id="password" placeholder="••••••••" required autofocus>
        <small style="font-size: 0.72rem; color: var(--text-dim); display: block; margin-top: 0.35rem;">
          Chave padrão do sistema: <strong>admin123</strong>
        </small>
      </div>

      <button type="submit" class="btn-login" style="margin-top: 0.5rem;">Avançar para Cadastro</button>
      <div style="text-align: center; margin-top: 1rem;">
        <a href="index.html" class="btn-back-link" style="margin-bottom: 0;">← Voltar ao Login</a>
      </div>
    </form>

    <div class="footer-text">
      © 2026 SENAI • Sistema de Monitoramento de Segurança
    </div>
  </div>

  <script>
    document.getElementById('adminKeyForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const pwd = document.getElementById('password').value.trim();
      if (pwd === "admin123" || pwd === "admin") {
        window.location.href = 'cadastro_usuario.html';
      } else {
        alert('❌ Senha administrativa incorreta! Tente novamente ou use "admin123".');
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
      }
    });
  </script>

</body>
</html>
