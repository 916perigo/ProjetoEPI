<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Acesso | Sistema de Detecção de EPI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/esqueci_senha.css">
</head>
<body>
    <div class="bg-animation"></div>
    <div class="forgot-card">
        <div class="icon-box">⚠</div>
        <h2>Recuperar Senha</h2>
        <p>Informe seu e-mail cadastrado para receber as instruções de redefinição.</p>

        <div id="successAlert" class="alert-custom">
            Solicitação enviada! Verifique seu e-mail ou procure o RH/TI.
        </div>

        <form id="forgotForm">
            <div class="mb-3">
                <label class="form-label">E-mail</label>
                <input type="text" class="form-control" id="identity" placeholder="Ex: email@empresa.com" required>
            </div>
            <button type="submit" class="btn-reset" id="submitBtn">Solicitar Nova Senha</button>
        </form>

        <a href="index.html" class="back-link">← Voltar para o Login</a>
    </div>
    <script src="js/esqueci_senha.js"></script>
</body>
</html>
