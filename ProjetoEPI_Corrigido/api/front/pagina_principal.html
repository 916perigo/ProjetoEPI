<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Dashboard EPI - Home</title>
</head>
<body class="bg-[#1A1A1A] text-white font-sans min-h-screen flex flex-col">

    <header class="border-b border-gray-700 bg-[#262626] p-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div id="avatarInicial" class="w-10 h-10 rounded-full bg-yellow-400 flex items-center justify-center text-black font-bold text-lg">?</div>
            <p class="font-semibold text-sm" id="nomeUsuario">Carregando...</p>
        </div>
        <button onclick="logout()" class="text-red-500 text-sm border border-red-500/50 px-3 py-1 rounded hover:bg-red-500/10 transition">Logout</button>
    </header>

    <main class="max-w-2xl mx-auto p-6 flex-1 flex flex-col justify-center w-full">
        <div class="grid grid-cols-1 gap-6">
            <a href="verificacao.html" class="bg-yellow-500 text-black font-extrabold py-8 px-6 text-xl rounded-2xl text-center shadow-2xl hover:bg-yellow-400 transform hover:-translate-y-1 transition-all duration-200 uppercase tracking-wide flex items-center justify-center gap-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                Nova Verificação IA
            </a>
            
            <a href="solicitar.html" class="bg-gray-800 text-white font-extrabold py-8 px-6 text-xl rounded-2xl text-center border-2 border-gray-600 hover:border-yellow-500 hover:bg-gray-700 transform hover:-translate-y-1 transition-all duration-200 uppercase tracking-wide flex items-center justify-center gap-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-yellow-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
                Solicitar Novos EPI's
            </a>
        </div>
    </main>

    <script src="js/auth.js"></script>
    <script>
        const usuario = JSON.parse(localStorage.getItem('usuarioLogado') || '{}');
        if (usuario && usuario.nome) {
            const cargo = usuario.cargo ? usuario.cargo.charAt(0).toUpperCase() + usuario.cargo.slice(1) : 'Operacional';
            document.getElementById('nomeUsuario').textContent = usuario.nome + ' - ' + cargo;
            document.getElementById('avatarInicial').textContent = usuario.nome.charAt(0).toUpperCase();

            if (usuario.cargo === 'admin') {
                const adminBtn = document.createElement('a');
                adminBtn.href = 'pagina_admin.html';
                adminBtn.className = 'bg-blue-600 text-white font-extrabold py-6 px-6 text-lg rounded-2xl text-center shadow-xl hover:bg-blue-500 transform hover:-translate-y-1 transition-all duration-200 uppercase tracking-wide';
                adminBtn.textContent = 'Painel Administrativo';
                document.querySelector('.grid').appendChild(adminBtn);
            }
        }
        function logout() {
            localStorage.removeItem('usuarioLogado');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
